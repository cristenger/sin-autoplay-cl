<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Sin Autoplay CL</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <h1>Sin Autoplay CL</h1>
  <div id="migrationNotice" class="notice" hidden>
    Ahora todos los sitios están permitidos por defecto. Añade los que quieras bloquear; tus excepciones anteriores se conservan.
    <button id="dismissNotice" class="link-button">Entendido</button>
  </div>
  <section class="site-card" aria-label="Sitio actual">
    <div class="host" id="host">Cargando sitio…</div>
    <p class="status" id="hostStatus" role="status"></p>
    <p class="muted" id="ruleSource"></p>
    <label class="check"><input type="checkbox" id="includeSubdomains"> Incluir subdominios de este dominio</label>
    <button id="toggleHost" class="primary" disabled>Bloquear autoplay aquí</button>
  </section>
  <div class="row">
    <label for="enabled">Activar bloqueo en sitios elegidos</label>
    <input type="checkbox" id="enabled">
  </div>
  <div class="row">
    <label for="mode">En sitios bloqueados</label>
    <select id="mode">
      <option value="autoplay">Bloquear autoplay</option>
      <option value="hide">Ocultar reproductores</option>
    </select>
  </div>
  <p class="muted">En modo autoplay puedes reproducir con el botón Play o los controles del reproductor.</p>
  <p id="error" class="error" role="alert"></p>
  <button id="manageSites" class="full-width">Gestionar sitios</button>
  <script src="site-policy.js"></script>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
