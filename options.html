<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle"></title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="options">
  <header>
    <h1 data-i18n="manageSites"></h1>
    <p class="intro" data-i18n="optionsIntro"></p>
  </header>
  <div id="migrationNotice" class="notice" hidden>
    <span data-i18n="optionsMigration"></span>
    <button id="dismissNotice" class="link-button" data-i18n="dismissNotice"></button>
  </div>
  <section class="panel" data-i18n-aria-label="preferences">
    <div class="row">
      <label for="enabled" data-i18n="enableBlocking"></label><input type="checkbox" id="enabled">
    </div>
    <div class="row">
      <label for="mode" data-i18n="onBlockedSites"></label>
      <select id="mode"><option value="autoplay" data-i18n="blockAutoplay"></option><option value="hide" data-i18n="hidePlayers"></option></select>
    </div>
    <p id="pausedNotice" class="muted" hidden data-i18n="pausedNotice"></p>
  </section>
  <section class="panel" aria-labelledby="addHeading">
    <h2 id="addHeading" data-i18n="addSite"></h2>
    <form id="siteForm">
      <div class="form-grid">
        <label class="field" for="siteUrl"><span data-i18n="domainOrUrl"></span>
          <input id="siteUrl" type="text" data-i18n-placeholder="urlPlaceholder" required autocomplete="off" spellcheck="false" aria-describedby="preview">
        </label>
        <label class="field" for="siteAction"><span data-i18n="action"></span>
          <select id="siteAction"><option value="block" data-i18n="blockAutoplay"></option><option value="allow" data-i18n="allowAutoplay"></option></select>
        </label>
      </div>
      <label class="check"><input id="includeSubdomains" type="checkbox"> <span data-i18n="includeSavedSubdomains"></span></label>
      <p id="preview" class="muted" aria-live="polite" data-i18n="ruleHelp"></p>
      <button class="primary" type="submit" data-i18n="saveSite"></button>
    </form>
  </section>
  <p id="error" class="error" role="alert"></p>
  <p id="feedback" role="status" aria-live="polite"></p>
  <div class="toolbar">
    <div class="filters" role="group" data-i18n-aria-label="filterRules">
      <button data-filter="all" aria-pressed="true" data-i18n="filterAll"></button>
      <button data-filter="block" aria-pressed="false" data-i18n="filterBlock"></button>
      <button data-filter="allow" aria-pressed="false" data-i18n="filterAllow"></button>
    </div>
    <label class="field" for="search"><span data-i18n="searchDomain"></span><input id="search" type="search" data-i18n-placeholder="searchPlaceholder"></label>
  </div>
  <p class="muted" data-i18n="precedenceHelp"></p>
  <div class="table-scroll">
    <table>
      <thead><tr><th scope="col" data-i18n="domain"></th><th scope="col" data-i18n="autoplay"></th><th scope="col" data-i18n="scope"></th><th scope="col" data-i18n="actions"></th></tr></thead>
      <tbody id="rules"></tbody>
    </table>
  </div>
  <p id="empty" class="empty" hidden data-i18n="emptyRules"></p>
  <script src="i18n.js"></script>
  <script src="site-policy.js"></script>
  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
